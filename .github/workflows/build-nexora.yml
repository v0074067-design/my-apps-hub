
name: Build NEXORA VIOLET APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NEXORA_VIOLET_Installer_Source_Redmi13C.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip NEXORA_VIOLET_Installer_Source_Redmi13C.zip -d nexora_src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p nexora_src assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-VIOLET-APK
          path: nexora_src/app/build/outputs/apk/debug/*.apk
          
